<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCaptcha Solver</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; padding: 24px; color: #333; }
  .card { max-width: 860px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  h1 { font-size: 20px; margin-bottom: 16px; }
  .form { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #666; }
  .form input { width: 180px; padding: 8px 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; }
  .form input:focus { outline: none; border-color: #4a7cf7; }
  button { padding: 8px 20px; border: none; border-radius: 6px; background: #4a7cf7; color: #fff; font-size: 14px; cursor: pointer; align-self: flex-end; }
  button:hover { background: #3a6ce7; }
  button:disabled { background: #a0bdf0; cursor: not-allowed; }
  .status { font-size: 13px; margin-bottom: 8px; }
  .status.ok { color: #2e9e5b; } .status.err { color: #e05252; }
  pre { background: #1e1e2e; color: #dcdfe4; padding: 16px; border-radius: 8px; font-size: 13px; line-height: 1.6; overflow: auto; white-space: pre-wrap; word-break: break-all; min-height: 120px; }
</style>
</head>
<body>
<div class="card">
  <h1>腾讯滑块验证码求解</h1>
  <div class="form">
    <label>captcha_a_id<input id="aid" value="1600000770"></label>
    <label>tkid<input id="tkid" placeholder="可选"></label>
    <label>retry<input id="retry" type="number" min="1" max="5" value="3"></label>
    <button id="btn">调用 /solve</button>
  </div>
  <div class="status" id="status"></div>
  <pre id="output">正在调用接口...</pre>
</div>
<script>
// file:// 直接打开时走本地服务,部署同源时留空
const API = location.protocol === 'file:' ? 'http://localhost:8000' : '';

async function solve() {
  const out = document.getElementById('output');
  const st = document.getElementById('status');
  const btn = document.getElementById('btn');
  btn.disabled = true;
  st.textContent = '请求中...';
  st.className = 'status';
  const p = new URLSearchParams({
    captcha_a_id: document.getElementById('aid').value.trim(),
    tkid: document.getElementById('tkid').value.trim(),
    retry: document.getElementById('retry').value || '3'
  });
  const t0 = performance.now();
  try {
    const res = await fetch(`${API}/solve?${p}`);
    const data = await res.json();
    const ms = Math.round(performance.now() - t0);
    st.textContent = `HTTP ${res.status} · ${ms}ms`;
    st.className = 'status ' + (data.code === 0 ? 'ok' : 'err');
    out.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    st.textContent = '请求失败';
    st.className = 'status err';
    out.textContent = String(e);
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('btn').addEventListener('click', solve);
solve(); // 默认打开页面即调用
</script>
</body>
</html>
